<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 22</title>
</head>
<body>

<button onclick="contar()">Clique</button>
<p id="resultado">0</p>
<script>
var cliques = 0
function contar() {
    cliques = cliques + 1
    var resultado = document.querySelector("#resultado")
    resultado.innerText = cliques
}
</script>

</body>
</html>
