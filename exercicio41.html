<!DOCTYPE html><html><head><title>Exercício 41</title></head><body><button onclick="vermelho()">Vermelho</button><button onclick="amarelo()">Amarelo</button><button onclick="verde()">Verde</button><div id="semaforo" style="width:100px;height:100px;border-radius:50%;background-color:gray;"></div><script>function vermelho(){var semaforo=document.querySelector("#semaforo");semaforo.style.backgroundColor="red";}function amarelo(){var semaforo=document.querySelector("#semaforo");semaforo.style.backgroundColor="yellow";}function verde(){var semaforo=document.querySelector("#semaforo");semaforo.style.backgroundColor="green";}</script></body></html>
