<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function mostrar(){
            var data = new Date()
            document.querySelector('#data').innerText = data
        }
    </script>
</head>
<body>
    <p id="data">Clique no botaaaaoo</p>
    <button onclick="mostrar()">Mostrar data e hora</button>
</body>
</html>
